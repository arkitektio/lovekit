projects:
  lovekit:
    schema: http://localhost/lovekit/schema
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: lovekit/api
        exclude_typenames: true
        dump_configuration: true
        dump_schema: true
        freeze:
          enabled: true
        options:
          # snake_case is the only python-facing spelling a type checker sees;
          # the GraphQL name stays the wire name. Both still validate.
          alias_mode: split
          enabled: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.client.ClientPlugin
            # Every operation is a method of LovekitApi, which the client mixes in.
            # Each method hands its operation to execute/aexecute/subscribe/asubscribe
            # of self, which the client (lovekit.lovekit.Lovekit) implements over its rath.
            client_class: LovekitApi
            # The client's own attributes: pydantic lets a field hide a method.
            reserved_from:
              - lovekit.lovekit.Lovekit
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
        processors:
          - type: turms.processors.black.BlackProcessor
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          JSON: typing.Any
          ID: rath.scalars.ID
