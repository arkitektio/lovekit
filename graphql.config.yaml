projects:
  lovekit:
    schema: http://localhost/lovekit/schema
    documents: graphql/*/**.graphql
    extensions:
      turms:
        out_dir: lovekit/api
        exclude_typenames: true
        dump_configuration: true
        dump_schema: true
        freeze:
          enabled: true
        options:
          # snake_case is the only python-facing spelling a type checker sees;
          # the GraphQL name stays the wire name. Both still validate.
          alias_mode: split
          enabled: true
          extra: forbid
          types:
            - input
        stylers:
          - type: turms.stylers.default.DefaultStyler
          - type: turms.stylers.appender.AppenderStyler
            append_fragment: ""
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
          - type: turms.plugins.inputs.InputsPlugin
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
          - type: turms.plugins.funcs.FuncsPlugin
            coercible_scalars:
              ID: rath.scalars.IDCoercible
            expand_input_types:
              - input
            global_kwargs:
              - type: lovekit.rath.LovekitRath
                key: rath
                description:
                  The client we want to use (defaults to the currently active
                  client)
            definitions:
              - type: subscription
                is_async: true
                use: lovekit.funcs.asubscribe
              - type: query
                is_async: true
                use: lovekit.funcs.aexecute
              - type: mutation
                is_async: true
                use: lovekit.funcs.aexecute
              - type: subscription
                use: lovekit.funcs.subscribe
              - type: query
                use: lovekit.funcs.execute
              - type: mutation
                use: lovekit.funcs.execute
        processors:
          - type: turms.processors.black.BlackProcessor
        scalar_definitions:
          uuid: str
          Callback: str
          Any: typing.Any
          JSON: typing.Any
          ID: rath.scalars.ID
