fragment DataFormat on DataFormat {
  dtype
  shape
  unit
  reference
  axes {
    name
    type
  }
  calibration {
    axis
    unit
    scale
    offset
  }
}

fragment VideoFormat on VideoFormat {
  shape
  reference
  axes {
    name
    type
  }
  calibration {
    axis
    unit
    scale
    offset
  }
}

fragment Stream on Stream {
  id
  key
  title
  kind
  description
  format {
    ...DataFormat
  }
  videoFormat {
    ...VideoFormat
  }
  agent {
    id
    roomName
  }
}
