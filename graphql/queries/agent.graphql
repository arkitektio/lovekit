query GetAgent($id: ID!) {
  agent(id: $id) {
    ...Agent
    live
    streams {
      ...Stream
      live
    }
  }
}

query SearchAgents($search: String, $values: [ID!]) {
  options: agents(
    filters: { search: $search, ids: $values }
    pagination: { limit: 10 }
  ) {
    value: id
    label: name
  }
}
