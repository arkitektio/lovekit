services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten:latest
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: lovekit
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    environment:
      LIVEKIT_KEYS: "devkey: devsecret_devsecret_devsecret_devsecret"
    ports:
      - 5678:7880
  # Brings the database to the image's release, once, before the server is started: a
  # service's own start only serves.
  lovekit-migrate:
    depends_on:
      - db
    image: jhnnsrs/lovekit:${LOVEKIT_SERVICE_TAG:-latest}
    command: arkitekt-service run migrate
    volumes:
      - ./configs/lovekit.yaml:/workspace/config.yaml
  lovekit:
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
      rustfs:
        condition: service_started
      livekit:
        condition: service_started
      lovekit-migrate:
        condition: service_completed_successfully
    image: jhnnsrs/lovekit:${LOVEKIT_SERVICE_TAG:-latest}
    command: arkitekt-service debug
    stop_grace_period: 1s
    ports:
      - "${LOVEKIT_HOST_PORT:-6890}:80"
    volumes:
      - ./configs/lovekit.yaml:/workspace/config.yaml
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: rustfs/rustfs:latest
    ports:
      - "${RUSTFS_HOST_PORT:-6891}:9000"
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: jhnnsrs/init:latest
    volumes:
      - ./configs/rustfs.yaml:/workspace/config.yaml
