services:
  redis:
    image: redis:latest
  db:
    image: jhnnsrs/daten_next:nightly
    restart: always
    environment:
      POSTGRES_MULTIPLE_DATABASES: lovekit
      POSTGRES_PASSWORD: hello_django
      POSTGRES_USER: hello_django
  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    environment:
      LIVEKIT_KEYS: "devkey: devsecret_devsecret_devsecret_devsecret"
    ports:
      - 5678:7880
  lovekit:
    depends_on:
      - redis
      - db
      - rustfs
      - livekit
    image: jhnnsrs/lovekit:${LOVEKIT_SERVICE_TAG:-next}
    command: bash run-debug.sh
    stop_grace_period: 1s
    ports:
      - "${LOVEKIT_HOST_PORT:-6890}:80"
    volumes:
      - ./configs/lovekit.yaml:/workspace/config.yaml
  rustfs:
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: rustfs/rustfs:latest
    ports:
      - "${RUSTFS_HOST_PORT:-6891}:9000"
  initc:
    depends_on:
      rustfs:
        condition: service_started
    environment:
      RUSTFS_HOST: http://rustfs:9000
      RUSTFS_SECRET_KEY: minio_root_password
      RUSTFS_ACCESS_KEY: minio_root_user
    image: jhnnsrs/init:next
    volumes:
      - ./configs/rustfs.yaml:/workspace/config.yaml
